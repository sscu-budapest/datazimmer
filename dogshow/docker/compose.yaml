# One-command cross-package coverage run:
#   docker compose -f dogshow/docker/compose.yaml up --build --abort-on-container-exit
#
# The whole monorepo is bind-mounted at /code so uv resolves the editable
# sibling sources (../../../.. from this file is the code/ root). The image
# carries no source — it always runs against the live tree.
services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    # init: a real PID 1 (tini) that reaps orphaned subprocess workers, so a
    # killed run leaves no zombies behind inside the container.
    init: true
    working_dir: /code/apps/datazimmer/dogshow
    volumes:
      - ../../../..:/code
