[project]
name = "dogshow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["datazimmer[collect,s3,zenodo]"]

[dependency-groups]
# the fake federation site (flask), the soup/relay handlers (bs4/flask-cors),
# the s3 backend test (moto), and cross-package coverage (coverage)
dev = [
    "pytest",
    "coverage",
    "pytest-timeout",
    "flask",
    "flask-cors",
    "beautifulsoup4",
    "requests",
    "moto[s3]",
]

[tool.datazimmer]
name = "dogshow"
version = "0.1.0"
package = "src"

[tool.datazimmer.remote]
kind = "local"
url = "_remote"

[tool.uv]
package = false

[tool.uv.sources]
datazimmer = { path = "..", editable = true }
shackleton = { path = "../../../libs/shackleton", editable = true }
sqlmermaid = { path = "../../sqlmermaid", editable = true }
protocli = { path = "../../../libs/protocli", editable = true }
aswan = { path = "../../../libs/aswan", editable = true }
dirark = { path = "../../../libs/dirark", editable = true }
atqo = { path = "../../../libs/atqo", editable = true }

[tool.ruff]
line-length = 88

# Layered hang guards: --timeout bounds any single test; --session-timeout bounds
# the whole session (incl. session-fixture setup/teardown the per-test timer can
# miss). Both are Python-level; report.py adds an external process-group kill that
# survives even a native GIL-holding deadlock.
[tool.pytest.ini_options]
addopts = "-q --timeout=120 --timeout-method=thread --session-timeout=600"
testpaths = ["tests"]

[tool.coverage.run]
# Collection runs handler/session code in spawned mp.Process workers and the
# relay server in a thread inside them; measure both, across every editable
# package, so one suite reports the whole ecosystem.
source = ["datazimmer", "aswan", "atqo", "dirark", "shackleton", "sqlmermaid"]
# report on package source only — the siblings ship their own test suites, and
# the fake federation site / fixtures aren't the thing under measure
omit = ["*/tests/*", "*/test_*.py", "*/conftest.py", "*/__main__.py", "*/site/*"]
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true
branch = true

[tool.coverage.report]
# a readable report: drop import-only/empty files, show the missing lines, and
# honour the `# pragma: no cover` markers on the spawned-subprocess entrypoints
show_missing = true
skip_empty = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.html]
title = "datazimmer ecosystem coverage — one dogshow suite, six packages"
skip_empty = true
