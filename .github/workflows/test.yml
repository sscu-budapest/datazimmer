name: Python Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Lint
        run: uvx ruff check datazimmer/
      # the sibling libraries resolve from PyPI here; locally they are editable
      # checkouts via [tool.uv.sources]
      - name: Test
        run: uv run --no-sources pytest
