[project]
name = "datazimmer"
dynamic = ["version", "description"]
authors = [{name = "Social Science Computing Unit Budapest", email = "borza.endre@krtk.hu"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "sqlalchemy>=2.0.0",
    "shackleton",
    "sqlmermaid",
]
scripts = {datazimmer = "datazimmer.cli:main", dz = "datazimmer.cli:main"}

[project.optional-dependencies]
collect = ["aswan"]
s3 = ["boto3"]
zenodo = ["requests"]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-timeout"]

[project.urls]
Homepage = "https://github.com/sscu-budapest/datazimmer"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.uv.sources]
shackleton = { path = "../../libs/shackleton", editable = true }
sqlmermaid = { path = "../sqlmermaid", editable = true }
aswan = { path = "../../libs/aswan", editable = true }
dirark = { path = "../../libs/dirark", editable = true }
atqo = { path = "../../libs/atqo", editable = true }

[tool.ruff]
line-length = 88

# Root pytest runs only the core unit suite. The dogshow cross-package
# integration/e2e suite is a separate uv project (its own venv + test extras);
# run it with `cd dogshow && uv run pytest`.
[tool.pytest.ini_options]
testpaths = ["datazimmer/tests"]
addopts = "-q --timeout=60"
